name: RecursiveCal tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[bayes,verifiers]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Core demo
        run: python demo.py
      - name: Verifiers v1 import
        run: |
          python - <<'PY'
          import verifiers.v1 as vf
          from safecal_v1 import SafeCalTaskset, SafeCalVerifierEnv
          assert issubclass(SafeCalTaskset, vf.Taskset)
          assert issubclass(SafeCalVerifierEnv, vf.Env)
          print("Verifiers v1 imports PASS")
          PY
