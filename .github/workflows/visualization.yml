name: RecursiveCal visual lab

on:
  push:
    branches: [main]
    paths:
      - 'visualization/**'
      - '.github/workflows/visualization.yml'
  pull_request:
    paths:
      - 'visualization/**'
      - '.github/workflows/visualization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-visualization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser script syntax
        run: node --check visualization/app.js && node --check visualization/engine.js
      - name: Rebuild standalone HTML from source
        run: python visualization/build.py
      - name: Verify generated HTML is up to date
        run: git diff --exit-code -- visualization/index.html
      - name: Compare Python and JavaScript physics
        run: python visualization/verify_parity.py
