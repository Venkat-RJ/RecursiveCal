name: RecursiveCal product

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-rl-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        verifiers: ['0.4.0', '0.4.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real supported Verifiers SDK
        run: python -m pip install -e '.[verifiers]' 'verifiers==${{ matrix.verifiers }}'
      - name: Exercise physical plugin with scripted replies and real SDK types
        env:
          RECURSIVECAL_REQUIRE_VERIFIERS: '1'
        run: python -m unittest discover -s tests -p 'test_physical_adapter.py' -v

  research-rig-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent reference solver
        run: python -m pip install '.[validation]'
      - name: Audit coupled drives, sensors, faults and healthy reference
        run: python scripts/validate_research_rig.py --output artifacts/research-rig-validation.json
      - name: Preserve complete model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursivecal-research-rig-validation
          path: artifacts/research-rig-validation.json
          retention-days: 30

  physics-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent numerical solver
        run: python -m pip install '.[validation]'
      - name: Check analytical mechanics and event timing
        run: python -m unittest discover -s tests -p 'test_mechanics_foundation_v2.py' -v
      - name: Compare independent trajectories and long conservative motion
        run: python scripts/validate_physics.py --output artifacts/physics-validation.json
      - name: Preserve numerical validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursivecal-physics-validation
          path: artifacts/physics-validation.json
          retention-days: 30

  package-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            numpy: 'numpy==1.24.4'
          - python: '3.12'
            numpy: 'numpy==2.3.5'
          - python: '3.13'
            numpy: 'numpy==2.3.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install supported numerical version and package tools
        run: python -m pip install '${{ matrix.numpy }}' build ruff
      - name: Compile and check new Python code
        run: |
          python -m compileall -q recursivecal_lab research
          ruff check recursivecal_lab tests/test_lab_*.py
      - name: Run product and preserved benchmark tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify source archive includes citation, manuscript and research evidence
        run: python scripts/check_release.py --archive dist/*.tar.gz
      - name: Test installed wheel away from source
        run: |
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          recursivecal doctor
          recursivecal simulate --output installed-run.json --csv installed-trace.csv
          recursivecal inquire --case weak_motor --output installed-inquiry.json
          recursivecal verify-inquiry installed-inquiry.json
          recursivecal rl-rollout --policy no_probe --split test --seed 7 --output installed-physical-rl.json
          recursivecal verify-rl installed-physical-rl.json
          recursivecal experiment --quick --output installed-experiment
          recursivecal verify installed-experiment
      - name: Preserve package artifacts
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: recursivecal-v0.5-packages
          path: dist/
          retention-days: 30

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workbench and browser test tools
        run: |
          python -m pip install . playwright
          python -m playwright install --with-deps chromium webkit
      - name: Check native camera interactions in Chromium and WebKit
        run: |
          node tests/camera_contracts.cjs
          python tests/camera_smoke.py --all --output artifacts/camera-browser
      - name: Exercise real HTTP workbench, CSV import, exports and mobile layout
        run: |
          node tests/workbench_contracts.cjs
          python tests/workbench_smoke.py
      - name: Exercise physical inquiry, CAD replay, evidence export and independent rejection
        if: always()
        run: |
          node tests/workspace_contracts.cjs
          python tests/inquiry_smoke.py
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursivecal-workbench-evidence
          path: |
            artifacts/workbench/
            artifacts/inquiry-browser/
            artifacts/camera-browser/
          retention-days: 30

  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install .
      - name: Verify published experiment artifacts
        run: recursivecal verify research/releases/v0.3
      - name: Check documentation links and release metadata
        run: python scripts/check_release.py

